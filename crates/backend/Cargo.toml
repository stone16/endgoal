[package]
name = "endgoal-backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "endgoal-backend"
path = "src/main.rs"

[dependencies]
endgoal-shared = { path = "../shared" }
axum = { version = "0.8", features = ["ws"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["cors"] }
tokio-util = "0.7"
uuid = { workspace = true }
chrono = { workspace = true }
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
tokio = { workspace = true }
tokio-tungstenite = "0.26"
futures = "0.3"
